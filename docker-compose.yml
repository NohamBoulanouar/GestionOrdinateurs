services:

  postgres:
    image: postgres:15
    container_name: postgres_db
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: 1234
      POSTGRES_DB: GestionOrdinateursDb
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - appnet

  keycloak:
    image: quay.io/keycloak/keycloak:26.8.1
    container_name: keycloak
    environment:
      # compte de la console d'administration (http://localhost:8180)
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
      # URL publique : c'est l'issuer ("iss") de tous les tokens, même demandés via keycloak:8080
      KC_HOSTNAME: http://localhost:8180
      # les conteneurs (API, AuthentificationApi) appellent Keycloak par http://keycloak:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    # --import-realm : crée le realm gestionordinateurs (rôles, client, utilisateurs) au premier démarrage
    command: start-dev --import-realm
    ports:
      - "8180:8080"
    volumes:
      - keycloak_data:/opt/keycloak/data
      - ./keycloak:/opt/keycloak/data/import
    networks:
      - appnet

  authentification-api:
    image: ${DOCKER_ACCOUNT}/authentificationapi:latest
    build:
      context: .
      dockerfile: AuthentificationApi/Dockerfile
    container_name: authentification_api
    ports:
      - "5223:5223"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5223
      # appel serveur a serveur : on utilise le nom du service docker
      GestionOrdinateursApi__BaseUrl: http://gestionordinateurs-api:5163/api/
      # origine du front (navigateur) autorisee par CORS
      Cors__ClientOrigin: http://localhost:5000
      # Keycloak vu depuis le reseau docker
      Keycloak__Url: http://keycloak:8080/
    depends_on:
      - gestionordinateurs-api
      - keycloak
    networks:
      - appnet

  gestionordinateurs-api:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-api:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.API/Dockerfile
    container_name: gestionordinateurs_api
    ports:
      - "5163:5163"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5163
      # clés publiques Keycloak récupérées via le reseau docker (l'issuer reste localhost:8180)
      Keycloak__Authority: http://keycloak:8080/realms/gestionordinateurs
    depends_on:
      - postgres
      - keycloak
    networks:
      - appnet

  gestionordinateurs-gateway:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-gateway:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Gateway/Dockerfile
    container_name: gestionordinateurs_gateway
    ports:
      - "5010:5010"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:5010
      # adresse de l'API vue depuis le reseau docker (remplace localhost du appsettings.json)
      ReverseProxy__Clusters__gestionOrdinateursApi__Destinations__gestionOrdinateursApiService__Address: http://gestionordinateurs-api:5163/
      Cors__ClientOrigin: http://localhost:5000
    depends_on:
      - gestionordinateurs-api
    networks:
      - appnet

  gestionordinateurs-client:
    image: ${DOCKER_ACCOUNT}/gestionordinateurs-client:latest
    build:
      context: .
      dockerfile: GestionOrdinateurs.Client/Dockerfile
    container_name: gestionordinateurs_client
    ports:
      - "5000:5000"
    depends_on:
      - authentification-api
      - gestionordinateurs-gateway
    networks:
      - appnet

volumes:
  postgres_data:
  keycloak_data:

networks:
  appnet:
