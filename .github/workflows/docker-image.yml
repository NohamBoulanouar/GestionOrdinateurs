name: CI/CD Docker GestionOrdinateurs

on:
  workflow_dispatch:
  push:
    branches:
      - main

env:
  DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}

jobs:

  # Compilation de la solution et lancement des tests unitaires
  tests:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build --no-restore

      - name: Tests
        run: dotnet test --no-build

  # Construction et publication des images via docker-compose.yml (uniquement si les tests passent)
  docker:
    runs-on: ubuntu-latest
    needs: tests
    environment: dev

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Login Docker Hub
        run: echo "${{ secrets.DOCKER_PASSWORD }}" | docker login -u "${{ secrets.DOCKER_USERNAME }}" --password-stdin

      - name: Build images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose build

      # seuls nos services sont poussés (postgres et keycloak sont des images officielles)
      - name: Push images
        env:
          DOCKER_ACCOUNT: ${{ secrets.DOCKER_ACCOUNT }}
        run: docker compose push authentification-api gestionordinateurs-api gestionordinateurs-gateway gestionordinateurs-client
